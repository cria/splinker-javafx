pt.welcome.description=O spLinker é um software que facilita o envio de dados em formato Darwin Core Archive para a rede speciesLink, promovendo o compartilhamento de dados não confidenciais para apoiar a pesquisa, a educação e políticas voltadas à conservação e uso sustentável da biodiversidade.
es.welcome.description=spLinker facilita el envío de datos en formato Darwin Core Archive a la red speciesLink, promoviendo el intercambio de datos no confidenciales para apoyar la investigación, la educación y las políticas de conservación y uso sostenible de la biodiversidad.
en.welcome.description=spLinker makes it easy to send data in Darwin Core Archive format to the speciesLink network, promoting the sharing of nonconfidential data to support research, education, and policies for biodiversity conservation and sustainable use.

pt.help.description=O spLinker é uma ferramenta desenvolvida para facilitar o envio de dados para a rede speciesLink, utilizando o formato Darwin Core Archive (DwC-A). Com ele, você pode compartilhar dados não confidenciais sobre biodiversidade, contribuindo para a pesquisa científica, a educação e a formulação de políticas de conservação e uso sustentável.
es.help.description=spLinker facilita el envío de datos a la red speciesLink en formato Darwin Core Archive (DwC-A). Permite compartir datos no confidenciales sobre biodiversidad para contribuir a la investigación científica, la educación y las políticas de conservación y uso sostenible.
en.help.description=spLinker makes it easy to send data to the speciesLink network using Darwin Core Archive (DwC-A). You can share nonconfidential biodiversity data to support scientific research, education, and conservation and sustainable use policies.

